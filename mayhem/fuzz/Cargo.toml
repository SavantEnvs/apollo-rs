# Additive cargo-fuzz crate for the savantenvs commit-image integration.
#
# Ported from upstream's own workspace-member `fuzz/` crate (fuzz_targets are byte-for-byte
# copies — see mayhem/fuzz/fuzz_targets/). We do NOT reuse upstream's `fuzz/` directly: it is a
# member of the ROOT workspace (`fuzz/Cargo.toml` has no [workspace] table, so it inherits the
# root one), which means its Cargo.lock would be the ROOT Cargo.lock — landing outside `mayhem/`
# and failing the additive-confinement check. An empty [workspace] table here makes this crate
# its OWN workspace root, so `mayhem/fuzz/Cargo.lock` stays fully confined under `mayhem/`.
[workspace]

[package]
name = "apollo-rs-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
autotests = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
apollo-compiler = { path = "../../crates/apollo-compiler" }
apollo-parser = { path = "../../crates/apollo-parser" }
env_logger = "0.11.0"
log = "0.4.14"

[[bin]]
name = "validate_text"
path = "fuzz_targets/validate_text.rs"
test = false
doc = false
