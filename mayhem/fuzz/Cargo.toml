# Additive cargo-fuzz crate, its own workspace root so its Cargo.lock stays under mayhem/.
# It depends only on apollo-parser: at this commit apollo-compiler's API differs from the live layer's.
[workspace]

[package]
name = "apollo-rs-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
autotests = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
apollo-parser = { path = "../../crates/apollo-parser" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
